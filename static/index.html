<!doctype html><html><head><meta charset="utf-8"><title>SmartCart</title><style>body{font-family:Arial;background:#f4f7fb;color:#152238;margin:0}main{max-width:850px;margin:35px auto;background:#fff;padding:28px;border-radius:14px}h1{color:#2563eb}input,button{padding:10px;margin:4px;border-radius:6px;border:1px solid #b9c7dd}button{background:#2563eb;color:#fff;border:0;cursor:pointer}#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #dbe4f1;padding:12px;border-radius:8px}pre{white-space:pre-wrap;background:#f2f6fb;padding:12px}</style></head><body><main><h1>SmartCart AI E-Commerce</h1><p>Local learning project: products, recommendations, prediction, and analytics via FastAPI.</p><button onclick="loadProducts()">Browse products</button><button onclick="showHealth()">API status</button><div id="products"></div><pre id="out">Open /docs for complete API testing.</pre></main><script>async function loadProducts(){let x=await (await fetch('/products')).json();document.querySelector('#products').innerHTML=x.slice(0,12).map(p=>`<div class='card'><b>${p.product_name}</b><br>${p.category}<br>₹${p.price}<br>Rating: ${p.rating}<br>Stock: ${p.stock}</div>`).join('')}async function showHealth(){document.querySelector('#out').textContent='SmartCart API running. Visit /docs for Swagger UI and use customer1@smartcart.local / password123 for the demo admin account.'}</script></body></html>
